name: Publicar beta temporal
on:
  push:
    branches: [main]
    paths:
      - SenalSur_GitHub_Pages_beta.zip
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Extraer la beta ya compilada y verificada
        run: |
          unzip -q SenalSur_GitHub_Pages_beta.zip 'tv-platform-github-pages/out/*' -d staging
          mv staging/tv-platform-github-pages/out out
          test -f out/index.html
          python3 - <<'PYTHON'
          import json, hashlib
          d=json.load(open('out/catalog.json'))
          m=json.load(open('out/validation.json'))
          assert d['publicationMode']=='verified-only'
          approved={(x['channelId'],x['feedId'],x['streamId']):x for x in m['approved']}
          actual={}
          assert d['channels'] and len(approved)==len(m['approved'])
          for c in d['channels']:
              assert c['validatedOn']==m['validatedOn']==d['validatedOn'] and c['feeds']
              for f in c['feeds']:
                  assert f['candidates']
                  for s in f['candidates']:
                      key=(c['id'],f['id'],s['id'])
                      proof=approved[key]
                      assert key not in actual and proof['phase']=='playing'
                      assert proof['seconds']>=15 and proof['videoWidth']>0
                      assert proof['validatedOn']==d['validatedOn']
                      assert s['url'].startswith('https://') and not s['requiresHeaders']
                      assert hashlib.sha256(s['url'].encode()).hexdigest()==proof['urlSha256']
                      actual[key]=True
          assert actual.keys()==approved.keys()
          print(f"Seleccion validada: {len(d['channels'])} canales, {len(actual)} streams")
          PYTHON
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
